# allwatch.conf — configuration lue ligne par ligne par allwatch.sh.
# Les lignes vides et celles qui commencent par # sont ignorées.
#
# Paramètres du moteur, une ligne CLE=valeur chacun.
# Secondes entre deux passes de contrôle :
POLL_SECONDS=5
# Secondes accordées au port pour répondre à la sonde :
PROBE_TIMEOUT=3
# Relances tolérées dans la fenêtre avant le passage en VERROU_CRITIQUE :
MAX_RESTARTS=5
# Durée en secondes de la fenêtre de comptage des relances :
RESTART_WINDOW=60
# Cible vivante dont le port ne répond plus : restart la neutralise (SIGTERM puis SIGKILL)
# et la relance selon sa politique ; alert la laisse intacte et écrit une ALERTE GEL.
# Un crash suit la politique de la cible dans les deux cas. Valeur autre que restart ou alert : refus au démarrage.
ON_FREEZE=restart
#
# Cibles, une par ligne : id port politique commande…
# La commande est le reste de la ligne, découpée aux espaces (pas de guillemets),
# lancée au premier plan depuis le répertoire où allwatch.sh est lancé.
# Politiques : always (relancée même après un code 0, sauf drapeau <id>.stop),
# on-failure (relancée sur crash ou blocage seulement), transient (jamais relancée).
#
# Exemple : la maquette dummy-target.sh écoute sur le port 9001 ; elle est relancée
# si elle plante ou se bloque, et laissée éteinte après un arrêt propre.
demo 9001 on-failure ./dummy-target.sh 9001
